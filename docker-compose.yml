# docker-compose.yml
version: "3.9" # Versi ini sudah cukup, meskipun sekarang ada yang lebih baru

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - ephish_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db
      - analyzer
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql-db:3306/ephish_db
      - ANALYZER_URL=http://analyzer:5000
    volumes:
      # Tambahkan volume untuk menyimpan reports PDF
      - reports_volume:/app/reports
    networks:
      - ephish_network
    restart: on-failure

  analyzer:
    build: ./analyzer
    ports:
      - "5000:5000"
    volumes:
      - ./analyzer/yara_rules:/app/yara_rules
      # Tambahkan volume untuk reports PDF
      - reports_volume:/app/reports
    networks:
      - ephish_network

  mysql-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ephish_db
    volumes:
      # Perbaikan: Gunakan nama volume 'mysql_data' seperti yang didefinisikan di bawah
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ephish_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s

volumes:
  # Perbaikan: Beri nama yang jelas untuk volume data mysql
  mysql_data:
  # Tambahkan volume baru untuk reports
  reports_volume:

networks:
  ephish_network:
    driver: bridge
